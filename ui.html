<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>My LangGraph Agent</title>
    <style>
      body { font-family: sans-serif; max-width: 600px; margin: 40px auto; }
      #log { white-space: pre-wrap; padding: 12px; border: 1px solid #ccc; border-radius: 8px; min-height: 200px; }
      textarea { width: 100%; height: 80px; }
      button { padding: 8px 16px; margin-top: 8px; }
    </style>
  </head>
  <body>
    <h1>RAG Agent (LangGraph)</h1>

    <div>
      <textarea id="input" placeholder="Ask something..."></textarea><br/>
      <button onclick="send()">Send</button>
    </div>

    <h2>Answer</h2>
    <div id="answer"></div>

    <h2>Trace</h2>
    <div id="log"></div>

    <script>
      async function send() {
        const user_input = document.getElementById('input').value;
        const res = await fetch("http://127.0.0.1:8000/chat", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({ user_input })
        });

        const data = await res.json();
        document.getElementById('answer').innerText = data.answer;
        document.getElementById('log').innerText = data.trace.join(" -> ");
      }
    </script>
  </body>
</html>
